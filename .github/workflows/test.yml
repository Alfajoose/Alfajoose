name: Tests

on:
  workflow_dispatch:
  # Callable so the APK build can gate on a green suite instead of duplicating it.
  workflow_call:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'web/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'

# A push that supersedes an in-flight run makes the older one pointless.
#
# github.workflow must be in the key. Build APK calls this workflow via
# workflow_call, and with a group of just tests-<ref> that call and the
# standalone run landed in the same group and cancelled each other — every
# "Tests" run showed up cancelled even though the suite had actually passed
# inside the Build APK run. A check that is always cancelled is worse than no
# check, because people learn to ignore it. When called, github.workflow is the
# caller's name, so the two no longer collide.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The app is a single file loaded over file:// — Chromium alone is enough,
      # and --with-deps covers the shared libraries the runner lacks.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      # Only useful when something failed; a green run uploads nothing.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
