<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlfaAnimate</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #13131F;
      --panel:    #1E1E2E;
      --panel2:   #2A2A3E;
      --border:   rgba(100,100,160,0.28);
      --accent:   #5865F2;
      --accentH:  #6E7BFF;
      --text:     #CDD6F4;
      --dim:      #6C7086;
      --purple:   #BD93F9;
      --green:    #50FA7B;
      --red:      #FF6B6B;
      --toolbar:  60px;
      --topbar:   50px;
      --timeline: 140px;
      --layers:   210px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── Top Bar ─────────────────────────────── */
    #topbar {
      height: var(--topbar);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 6px;
      flex-shrink: 0;
      z-index: 10;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    #topbar::-webkit-scrollbar { display: none; }

    .logo { font-size: 15px; font-weight: 700; color: var(--purple); letter-spacing: 0.5px; margin-right: 6px; white-space: nowrap; }

    .sep { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }

    .btn {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 9px;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: background .12s, border-color .12s;
    }
    .btn:hover { background: #333355; border-color: var(--accent); }
    .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.red:hover { background: var(--red); border-color: var(--red); color: #fff; }
    .btn:disabled { opacity: .4; cursor: default; pointer-events: none; }

    .icon-btn {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      width: 30px; height: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background .12s;
    }
    .icon-btn:hover { background: #333355; border-color: var(--accent); }
    .icon-btn:disabled { opacity: .4; cursor: default; }

    #play-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .12s, transform .1s;
    }
    #play-btn:hover { background: var(--accentH); transform: scale(1.06); }

    .fps-wrap { display: flex; align-items: center; gap: 5px; }
    .fps-wrap label { color: var(--dim); }
    .fps-wrap input {
      width: 44px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 2px 4px;
      font-size: 12px;
      text-align: center;
    }

    .spacer { flex: 1; }

    /* ── Workspace ──────────────────────────── */
    #workspace { display: flex; flex: 1; overflow: hidden; }

    /* ── Left Toolbar ───────────────────────── */
    #left-toolbar {
      width: var(--toolbar);
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      gap: 4px;
      flex-shrink: 0;
    }

    .tool-btn {
      width: 44px; height: 44px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--dim);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      gap: 1px;
      transition: all .12s;
    }
    .tool-btn .lbl { font-size: 8px; }
    .tool-btn:hover { background: var(--panel2); color: var(--text); border-color: var(--border); }
    .tool-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .color-ring {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin: 2px 0;
    }
    .color-ring input[type=color] {
      position: absolute;
      inset: -6px;
      width: calc(100% + 12px);
      height: calc(100% + 12px);
      opacity: 0;
      cursor: pointer;
    }

    .size-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      margin: 2px 0;
    }
    .size-wrap .slbl { font-size: 8px; color: var(--dim); }
    .size-wrap input[type=range] {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 20px;
      height: 72px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .size-num { font-size: 9px; color: var(--dim); }

    .tb-sep { width: 36px; height: 1px; background: var(--border); margin: 2px 0; }

    /* ── Canvas Area ────────────────────────── */
    #canvas-wrapper {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: #0B0B18;
    }

    #canvas-container {
      position: absolute;
      transform-origin: 0 0;
    }

    #canvas-container canvas {
      position: absolute;
      top: 0; left: 0;
      display: block;
    }

    #cb-canvas   { z-index: 0; }
    #onion-canvas{ z-index: 1; }
    #comp-canvas { z-index: 2; }
    #temp-canvas { z-index: 3; cursor: crosshair; }

    .hud {
      position: absolute;
      background: rgba(20,20,40,.82);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      color: var(--dim);
      pointer-events: none;
      z-index: 100;
    }
    #zoom-hud { bottom: 10px; left: 10px; }
    #pos-hud  { bottom: 10px; right: 10px; }

    /* ── Layers Panel ───────────────────────── */
    #layers-panel {
      width: var(--layers);
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: width .18s;
    }
    #layers-panel.closed { width: 0; }

    #layers-head {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #layers-head span { font-weight: 600; color: var(--purple); }

    #layers-list { flex: 1; overflow-y: auto; padding: 5px; }
    #layers-list::-webkit-scrollbar { width: 4px; }
    #layers-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .layer-item {
      display: flex;
      align-items: center;
      padding: 5px 7px;
      border-radius: 6px;
      margin-bottom: 3px;
      border: 1px solid transparent;
      cursor: pointer;
      gap: 7px;
    }
    .layer-item:hover { background: var(--panel2); }
    .layer-item.sel { background: #25254A; border-color: var(--accent); }

    .layer-thumb {
      width: 30px; height: 22px;
      border-radius: 3px;
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      background: rgba(255,255,255,.04);
    }
    .layer-thumb canvas { width: 100%; height: 100%; }

    .layer-meta { flex: 1; min-width: 0; }
    .layer-name  { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layer-pct   { font-size: 9px; color: var(--dim); margin-top: 1px; }

    .vis-btn {
      background: none; border: none;
      color: var(--dim); cursor: pointer;
      font-size: 13px; padding: 2px;
      flex-shrink: 0;
    }
    .vis-btn:hover { color: var(--text); }

    #layers-foot {
      padding: 7px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 5px;
    }
    #layers-foot .btn { flex: 1; justify-content: center; font-size: 11px; }

    /* ── Opacity slider ─────────────────────── */
    #opacity-row {
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px solid var(--border);
    }
    #opacity-row label { font-size: 10px; color: var(--dim); white-space: nowrap; }
    #opacity-row input { flex: 1; accent-color: var(--accent); }
    #opacity-row span { font-size: 10px; color: var(--dim); width: 28px; text-align: right; }

    /* ── Timeline ───────────────────────────── */
    #timeline {
      height: var(--timeline);
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    #tl-head {
      padding: 4px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #tl-head .info { font-size: 11px; color: var(--dim); }

    #tl-scroll {
      flex: 1;
      display: flex;
      align-items: center;
      overflow-x: auto;
      padding: 8px 8px;
      gap: 6px;
    }
    #tl-scroll::-webkit-scrollbar { height: 4px; }
    #tl-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .frame-cell {
      flex-shrink: 0;
      width: 78px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      position: relative;
    }

    .frame-preview {
      width: 78px; height: 52px;
      border-radius: 4px;
      border: 2px solid var(--border);
      background: rgba(0,0,0,.3);
      overflow: hidden;
      transition: border-color .12s;
    }
    .frame-cell.sel .frame-preview { border-color: var(--accent); }
    .frame-cell:hover .frame-preview { border-color: rgba(88,101,242,.6); }
    .frame-preview canvas { width: 100%; height: 100%; }

    .frame-num { font-size: 9px; color: var(--dim); }
    .frame-cell.sel .frame-num { color: var(--accent); font-weight: 700; }

    .frame-del {
      position: absolute;
      top: -4px; right: -4px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--red);
      border: none;
      color: #fff;
      font-size: 9px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .frame-cell:hover .frame-del { display: flex; }

    #add-frame-cell {
      flex-shrink: 0;
      width: 52px; height: 52px;
      border-radius: 4px;
      background: var(--panel2);
      border: 2px dashed var(--border);
      color: var(--dim);
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: center;
      transition: all .15s;
    }
    #add-frame-cell:hover { border-color: var(--accent); color: var(--accent); background: rgba(88,101,242,.1); }

    /* scrollbar global */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--panel); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Mobile ─────────────────────────────── */
    @media (max-width: 599px) {
      :root { --toolbar: 52px; --timeline: 110px; --topbar: 46px; }

      .tool-btn { width: 38px; height: 38px; font-size: 16px; }
      .size-wrap input[type=range] { height: 54px; }

      /* hide less-critical toolbar items on very small screens */
      #zoom-in-btn, #zoom-out-btn { display: none; }

      /* make frame thumbnails smaller */
      .frame-preview { width: 60px; height: 40px; }
      .frame-cell { width: 60px; }
      .frame-preview canvas { width: 60px; height: 40px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ─── Top Bar ──────────────────────────────────── -->
  <div id="topbar">
    <span class="logo">✦ AlfaAnimate</span>
    <div class="sep"></div>
    <button class="icon-btn" id="undo-btn" title="Undo (Ctrl+Z)">↩</button>
    <button class="icon-btn" id="redo-btn" title="Redo (Ctrl+Y)">↪</button>
    <div class="sep"></div>
    <button class="icon-btn" id="stop-btn" title="Stop">⏹</button>
    <button id="play-btn" title="Play / Pause (Space)">▶</button>
    <div class="sep"></div>
    <button class="btn" id="add-frame-btn" title="Add Frame">+ Frame</button>
    <button class="btn" id="dup-frame-btn" title="Duplicate Frame">⧉ Dup</button>
    <button class="btn red" id="del-frame-btn" title="Delete Frame">✕ Del</button>
    <div class="sep"></div>
    <button class="btn" id="onion-btn" title="Toggle Onion Skin">◎ Onion</button>
    <div class="fps-wrap">
      <label>FPS</label>
      <input type="number" id="fps-inp" value="12" min="1" max="60">
    </div>
    <div class="spacer"></div>
    <button class="btn" id="toggle-layers-btn">☰ Layers</button>
  </div>

  <!-- ─── Workspace ───────────────────────────────── -->
  <div id="workspace">

    <!-- Left Toolbar -->
    <div id="left-toolbar">
      <button class="tool-btn active" data-tool="pen"    title="Pen (P)">✏️<span class="lbl">Pen</span></button>
      <button class="tool-btn"        data-tool="brush"  title="Brush (B)">🖌<span class="lbl">Brush</span></button>
      <button class="tool-btn"        data-tool="eraser" title="Eraser (E)">◻<span class="lbl">Erase</span></button>
      <button class="tool-btn"        data-tool="fill"   title="Fill (F)">🪣<span class="lbl">Fill</span></button>
      <div class="tb-sep"></div>
      <div class="color-ring" id="color-ring" title="Color (C)">
        <input type="color" id="color-inp" value="#ffffff">
      </div>
      <div class="tb-sep"></div>
      <div class="size-wrap">
        <span class="slbl">Size</span>
        <input type="range" id="size-slider" min="1" max="80" value="8">
        <span class="size-num" id="size-num">8</span>
      </div>
      <div class="tb-sep"></div>
      <button class="tool-btn" id="zoom-in-btn"  title="Zoom In (+)">🔍<span class="lbl">In</span></button>
      <button class="tool-btn" id="zoom-out-btn" title="Zoom Out (-)">🔎<span class="lbl">Out</span></button>
      <button class="tool-btn" id="zoom-fit-btn" title="Fit Screen (0)">⊡<span class="lbl">Fit</span></button>
    </div>

    <!-- Canvas -->
    <div id="canvas-wrapper">
      <div id="canvas-container">
        <canvas id="cb-canvas"></canvas>
        <canvas id="onion-canvas"></canvas>
        <canvas id="comp-canvas"></canvas>
        <canvas id="temp-canvas"></canvas>
      </div>
      <div class="hud" id="zoom-hud">100%</div>
      <div class="hud" id="pos-hud">0, 0</div>
    </div>

    <!-- Layers Panel -->
    <div id="layers-panel">
      <div id="layers-head">
        <span>Layers</span>
        <button class="icon-btn" id="close-layers-btn" style="width:22px;height:22px;font-size:10px;">✕</button>
      </div>
      <div id="layers-list"></div>
      <div id="opacity-row">
        <label>Opacity</label>
        <input type="range" id="opacity-slider" min="0" max="100" value="100">
        <span id="opacity-val">100%</span>
      </div>
      <div id="layers-foot">
        <button class="btn" id="add-layer-btn">+ Layer</button>
        <button class="btn red" id="del-layer-btn">✕ Del</button>
      </div>
    </div>

  </div><!-- /workspace -->

  <!-- ─── Timeline ─────────────────────────────────── -->
  <div id="timeline">
    <div id="tl-head">
      <span class="info" id="tl-info">Frame 1 / 1</span>
    </div>
    <div id="tl-scroll">
      <button id="add-frame-cell">+</button>
    </div>
  </div>

</div><!-- /app -->

<script>
// ═══════════════════════════════════════════════════════════
//  AlfaAnimate — HTML5 Animation Studio
// ═══════════════════════════════════════════════════════════

const CW = 1280, CH = 720;   // canvas dimensions

// ── Canvas elements ──────────────────────────────────────
const cbEl    = document.getElementById('cb-canvas');
const onionEl = document.getElementById('onion-canvas');
const compEl  = document.getElementById('comp-canvas');
const tempEl  = document.getElementById('temp-canvas');
const wrapper = document.getElementById('canvas-wrapper');
const container = document.getElementById('canvas-container');

const cbCtx    = cbEl.getContext('2d');
const onionCtx = onionEl.getContext('2d');
const compCtx  = compEl.getContext('2d');
const tempCtx  = tempEl.getContext('2d');

[cbEl, onionEl, compEl, tempEl].forEach(c => {
  c.width = CW; c.height = CH;
  c.style.width = CW + 'px'; c.style.height = CH + 'px';
});

// ── State ────────────────────────────────────────────────
const S = {
  fps: 12,
  frames: [],       // [{layers:[{name,canvas,visible,opacity}], duration}]
  frame: 0,         // active frame index
  layer: 0,         // active layer index

  tool:  'pen',     // pen | brush | eraser | fill
  color: '#ffffff',
  size:  8,

  playing: false,
  playTimer: null,
  onion: false,

  // undo/redo
  history: [],      // [{fi, li, data: ImageData}]
  hi: -1,           // history pointer

  // view
  zoom: 1, panX: 0, panY: 0,

  // draw
  drawing: false,
  pts: [],
  lx: 0, ly: 0,
};

// ── Layer / Frame factories ───────────────────────────────
function mkLayer(name = 'Layer') {
  return { name, canvas: new OffscreenCanvas(CW, CH), visible: true, opacity: 1.0 };
}
function mkFrame() {
  return { layers: [mkLayer('Layer 1')], duration: Math.round(1000 / S.fps) };
}

// bootstrap
S.frames.push(mkFrame());

// ── Checkerboard (drawn once) ─────────────────────────────
(function drawCB() {
  const sz = 12;
  for (let y = 0; y < CH; y += sz)
    for (let x = 0; x < CW; x += sz) {
      cbCtx.fillStyle = ((x / sz + y / sz) % 2 === 0) ? '#222232' : '#1A1A28';
      cbCtx.fillRect(x, y, sz, sz);
    }
})();

// ── Composite layers → compEl ─────────────────────────────
function renderComp() {
  const fr = S.frames[S.frame];
  compCtx.clearRect(0, 0, CW, CH);
  fr.layers.forEach(l => {
    if (!l.visible) return;
    compCtx.globalAlpha = l.opacity;
    compCtx.drawImage(l.canvas, 0, 0);
  });
  compCtx.globalAlpha = 1;
}

// ── Onion skin ────────────────────────────────────────────
function renderOnion() {
  onionCtx.clearRect(0, 0, CW, CH);
  if (!S.onion) return;

  function drawGhostedFrame(fr, tintR, tintG, tintB, alpha) {
    const off = new OffscreenCanvas(CW, CH);
    const ctx = off.getContext('2d');
    fr.layers.forEach(l => {
      if (!l.visible) return;
      ctx.globalAlpha = l.opacity;
      ctx.drawImage(l.canvas, 0, 0);
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = `rgba(${tintR},${tintG},${tintB},0.65)`;
    ctx.fillRect(0, 0, CW, CH);
    onionCtx.globalAlpha = alpha;
    onionCtx.drawImage(off, 0, 0);
    onionCtx.globalAlpha = 1;
  }

  if (S.frame > 0)
    drawGhostedFrame(S.frames[S.frame - 1], 255, 80, 80, 0.38);
  if (S.frame < S.frames.length - 1)
    drawGhostedFrame(S.frames[S.frame + 1], 80, 140, 255, 0.28);
}

// ── Full redraw ───────────────────────────────────────────
function render() {
  renderComp();
  renderOnion();
  refreshLayersPanel();
  refreshTimeline();
}

// ── Transform helpers ─────────────────────────────────────
function applyTransform() {
  container.style.transform = `translate(${S.panX}px,${S.panY}px) scale(${S.zoom})`;
  document.getElementById('zoom-hud').textContent = Math.round(S.zoom * 100) + '%';
}

function fitScreen() {
  const ww = wrapper.clientWidth, wh = wrapper.clientHeight;
  S.zoom = Math.min((ww - 32) / CW, (wh - 32) / CH);
  S.panX = (ww - CW * S.zoom) / 2;
  S.panY = (wh - CH * S.zoom) / 2;
  applyTransform();
}

function zoomAt(factor, cx, cy) {
  const nz = Math.min(20, Math.max(0.05, S.zoom * factor));
  const sc = nz / S.zoom;
  S.panX = cx - (cx - S.panX) * sc;
  S.panY = cy - (cy - S.panY) * sc;
  S.zoom = nz;
  applyTransform();
}

function toCanvas(cx, cy) {
  const r = wrapper.getBoundingClientRect();
  return [(cx - r.left - S.panX) / S.zoom, (cy - r.top - S.panY) / S.zoom];
}

// ── Active layer context ──────────────────────────────────
function activeCtx() {
  return S.frames[S.frame].layers[S.layer].canvas.getContext('2d');
}

// ── Draw helpers ──────────────────────────────────────────
function smoothPath(ctx, pts, ex, ey) {
  if (pts.length < 2) {
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(ex, ey);
    return;
  }
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i].x + pts[i + 1].x) / 2;
    const my = (pts[i].y + pts[i + 1].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  ctx.lineTo(ex, ey);
}

function applyStrokeStyle(ctx, isEraser) {
  ctx.lineWidth   = S.size;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  if (isEraser) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.shadowBlur  = 0;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = S.color;
    ctx.fillStyle   = S.color;
    ctx.shadowBlur  = (S.tool === 'brush') ? S.size * 1.5 : 0;
    ctx.shadowColor = S.color;
  }
}

function resetCtx(ctx) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;
}

// ── Flood fill ────────────────────────────────────────────
function floodFill(sx, sy) {
  sx = Math.floor(sx); sy = Math.floor(sy);
  if (sx < 0 || sx >= CW || sy < 0 || sy >= CH) return;

  const ctx = activeCtx();
  const imgD = ctx.getImageData(0, 0, CW, CH);
  const d = imgD.data;
  const ti = (sy * CW + sx) * 4;
  const tr = d[ti], tg = d[ti+1], tb = d[ti+2], ta = d[ti+3];

  const fr = parseInt(S.color.slice(1,3),16);
  const fg = parseInt(S.color.slice(3,5),16);
  const fb = parseInt(S.color.slice(5,7),16);

  if (tr===fr && tg===fg && tb===fb && ta===255) return;

  function same(i) { return d[i]===tr && d[i+1]===tg && d[i+2]===tb && d[i+3]===ta; }

  const stack = [[sx,sy]];
  const seen  = new Uint8Array(CW * CH);
  while (stack.length) {
    const [x,y] = stack.pop();
    if (x<0||x>=CW||y<0||y>=CH) continue;
    const k = y*CW+x;
    if (seen[k]) continue;
    seen[k]=1;
    const i=k*4;
    if (!same(i)) continue;
    d[i]=fr; d[i+1]=fg; d[i+2]=fb; d[i+3]=255;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imgD, 0, 0);
}

// ── Draw event handlers ───────────────────────────────────
function onDrawStart(x, y) {
  S.drawing = true;
  S.pts = [{x,y}];
  S.lx = x; S.ly = y;

  if (S.tool === 'fill') {
    floodFill(x, y);
    saveHist();
    render();
    S.drawing = false;
    return;
  }
  if (S.tool !== 'eraser') tempCtx.clearRect(0, 0, CW, CH);
}

function onDrawMove(x, y) {
  if (!S.drawing || S.tool === 'fill') return;
  S.pts.push({x,y});

  if (S.tool === 'eraser') {
    const ctx = activeCtx();
    applyStrokeStyle(ctx, true);
    ctx.beginPath();
    ctx.moveTo(S.lx, S.ly);
    ctx.lineTo(x, y);
    ctx.stroke();
    resetCtx(ctx);
    renderComp();
  } else {
    tempCtx.clearRect(0, 0, CW, CH);
    applyStrokeStyle(tempCtx, false);
    tempCtx.beginPath();
    smoothPath(tempCtx, S.pts, x, y);
    tempCtx.stroke();
    resetCtx(tempCtx);
  }
  S.lx = x; S.ly = y;
}

function onDrawEnd(x, y) {
  if (!S.drawing) return;
  S.drawing = false;

  if (S.tool === 'fill') return;

  if (S.tool === 'eraser') {
    saveHist(); render(); return;
  }

  const ctx = activeCtx();
  applyStrokeStyle(ctx, false);
  ctx.beginPath();

  if (S.pts.length === 1) {
    ctx.arc(S.pts[0].x, S.pts[0].y, S.size/2, 0, Math.PI*2);
    ctx.fill();
  } else {
    smoothPath(ctx, S.pts, x, y);
    ctx.stroke();
  }
  resetCtx(ctx);
  tempCtx.clearRect(0, 0, CW, CH);

  saveHist();
  render();
}

// ── Undo / Redo ───────────────────────────────────────────
function saveHist() {
  const fr = S.frames[S.frame];
  const la = fr.layers[S.layer];
  const ctx = la.canvas.getContext('2d');
  const snap = ctx.getImageData(0, 0, CW, CH);
  S.history = S.history.slice(0, S.hi + 1);
  S.history.push({ fi: S.frame, li: S.layer, snap });
  if (S.history.length > 30) S.history.shift(); else S.hi++;
  syncUndoRedo();
}

function undo() {
  if (S.hi <= 0) return;
  S.hi--;
  applyHist(S.history[S.hi]);
}

function redo() {
  if (S.hi >= S.history.length - 1) return;
  S.hi++;
  applyHist(S.history[S.hi]);
}

function applyHist(e) {
  const fr = S.frames[e.fi];
  if (!fr || !fr.layers[e.li]) return;
  fr.layers[e.li].canvas.getContext('2d').putImageData(e.snap, 0, 0);
  S.frame = e.fi; S.layer = e.li;
  render();
}

function syncUndoRedo() {
  document.getElementById('undo-btn').disabled = S.hi <= 0;
  document.getElementById('redo-btn').disabled = S.hi >= S.history.length - 1;
}

// ── Playback ──────────────────────────────────────────────
function play() {
  if (S.playing) { pauseAnim(); return; }
  S.playing = true;
  document.getElementById('play-btn').textContent = '⏸';

  function tick() {
    if (!S.playing) return;
    const delay = S.frames[S.frame].duration || Math.round(1000 / S.fps);
    S.playTimer = setTimeout(() => {
      S.frame = (S.frame + 1) % S.frames.length;
      renderComp(); renderOnion(); refreshTimeline();
      tick();
    }, delay);
  }
  tick();
}

function pauseAnim() {
  S.playing = false;
  clearTimeout(S.playTimer); S.playTimer = null;
  document.getElementById('play-btn').textContent = '▶';
}

function stopAnim() {
  pauseAnim();
  S.frame = 0;
  render(); refreshTimeline();
}

// ── Frame ops ─────────────────────────────────────────────
function addFrame() {
  const pos = S.frame + 1;
  S.frames.splice(pos, 0, mkFrame());
  S.frame = pos; S.layer = 0;
  render(); refreshTimeline();
}

function dupFrame() {
  const src = S.frames[S.frame];
  const copy = {
    layers: src.layers.map(l => {
      const nl = mkLayer(l.name);
      nl.canvas.getContext('2d').drawImage(l.canvas, 0, 0);
      nl.visible = l.visible; nl.opacity = l.opacity;
      return nl;
    }),
    duration: src.duration,
  };
  S.frames.splice(S.frame + 1, 0, copy);
  S.frame++;
  render(); refreshTimeline();
}

function delFrame(idx = S.frame) {
  if (S.frames.length <= 1) return;
  S.frames.splice(idx, 1);
  S.frame = Math.min(S.frame, S.frames.length - 1);
  S.layer = Math.min(S.layer, S.frames[S.frame].layers.length - 1);
  render(); refreshTimeline();
}

function gotoFrame(idx) {
  if (S.playing) return;
  S.frame = idx;
  S.layer = Math.min(S.layer, S.frames[idx].layers.length - 1);
  render(); refreshTimeline();
}

// ── Layer ops ─────────────────────────────────────────────
function addLayer() {
  const fr = S.frames[S.frame];
  fr.layers.push(mkLayer(`Layer ${fr.layers.length + 1}`));
  S.layer = fr.layers.length - 1;
  render();
}

function delLayer() {
  const fr = S.frames[S.frame];
  if (fr.layers.length <= 1) return;
  fr.layers.splice(S.layer, 1);
  S.layer = Math.min(S.layer, fr.layers.length - 1);
  render();
}

function toggleVis(idx) {
  S.frames[S.frame].layers[idx].visible ^= true;
  render();
}

// ── Layers panel UI ───────────────────────────────────────
function refreshLayersPanel() {
  const list = document.getElementById('layers-list');
  const fr   = S.frames[S.frame];
  list.innerHTML = '';

  for (let i = fr.layers.length - 1; i >= 0; i--) {
    const l = fr.layers[i];
    const row = document.createElement('div');
    row.className = 'layer-item' + (i === S.layer ? ' sel' : '');

    const thumbDiv = document.createElement('div');
    thumbDiv.className = 'layer-thumb';
    const thumbCv = document.createElement('canvas');
    thumbCv.width = 30; thumbCv.height = 22;
    thumbCv.getContext('2d').drawImage(l.canvas, 0, 0, 30, 22);
    thumbDiv.appendChild(thumbCv);

    const meta = document.createElement('div');
    meta.className = 'layer-meta';
    meta.innerHTML = `<div class="layer-name">${l.name}</div>
                      <div class="layer-pct">${Math.round(l.opacity*100)}%</div>`;

    const vis = document.createElement('button');
    vis.className = 'vis-btn';
    vis.textContent = l.visible ? '👁' : '🙈';
    vis.onclick = ev => { ev.stopPropagation(); toggleVis(i); };

    row.appendChild(thumbDiv);
    row.appendChild(meta);
    row.appendChild(vis);
    row.onclick = () => {
      S.layer = i;
      syncOpacitySlider();
      refreshLayersPanel();
    };
    list.appendChild(row);
  }
}

function syncOpacitySlider() {
  const fr = S.frames[S.frame];
  if (!fr.layers[S.layer]) return;
  const pct = Math.round(fr.layers[S.layer].opacity * 100);
  document.getElementById('opacity-slider').value = pct;
  document.getElementById('opacity-val').textContent = pct + '%';
}

// ── Timeline UI ───────────────────────────────────────────
function refreshTimeline() {
  const scroll  = document.getElementById('tl-scroll');
  const addCell = document.getElementById('add-frame-cell');

  // remove old cells
  scroll.querySelectorAll('.frame-cell').forEach(n => n.remove());

  S.frames.forEach((fr, idx) => {
    const cell = document.createElement('div');
    cell.className = 'frame-cell' + (idx === S.frame ? ' sel' : '');

    const prev = document.createElement('div');
    prev.className = 'frame-preview';
    const cv = document.createElement('canvas');
    cv.width = 78; cv.height = 52;
    const cx = cv.getContext('2d');
    fr.layers.forEach(l => {
      if (!l.visible) return;
      cx.globalAlpha = l.opacity;
      cx.drawImage(l.canvas, 0, 0, 78, 52);
    });
    cx.globalAlpha = 1;
    prev.appendChild(cv);

    const num = document.createElement('div');
    num.className = 'frame-num';
    num.textContent = idx + 1;

    const del = document.createElement('button');
    del.className = 'frame-del';
    del.textContent = '×';
    del.onclick = ev => { ev.stopPropagation(); delFrame(idx); };

    cell.appendChild(prev);
    cell.appendChild(num);
    cell.appendChild(del);
    cell.onclick = () => gotoFrame(idx);

    scroll.insertBefore(cell, addCell);
  });

  document.getElementById('tl-info').textContent =
    `Frame ${S.frame + 1} / ${S.frames.length}`;

  // scroll active frame into view
  const active = scroll.querySelector('.frame-cell.sel');
  if (active) active.scrollIntoView({ inline: 'nearest', behavior: 'smooth' });
}

// ── Mouse / Touch events ──────────────────────────────────
tempEl.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  onDrawStart(...toCanvas(e.clientX, e.clientY));
});
document.addEventListener('mousemove', e => {
  if (S.drawing) onDrawMove(...toCanvas(e.clientX, e.clientY));
  const [x,y] = toCanvas(e.clientX, e.clientY);
  document.getElementById('pos-hud').textContent =
    `${Math.round(x)}, ${Math.round(y)}`;
});
document.addEventListener('mouseup', e => {
  if (S.drawing) onDrawEnd(...toCanvas(e.clientX, e.clientY));
});

tempEl.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  onDrawStart(...toCanvas(t.clientX, t.clientY));
}, { passive: false });
tempEl.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  onDrawMove(...toCanvas(t.clientX, t.clientY));
}, { passive: false });
tempEl.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  if (t) onDrawEnd(...toCanvas(t.clientX, t.clientY));
}, { passive: false });

// ── Zoom / Pan ────────────────────────────────────────────
wrapper.addEventListener('wheel', e => {
  e.preventDefault();
  const r = wrapper.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

let panning=false, px0, py0, ppX, ppY;
wrapper.addEventListener('mousedown', e => {
  if (e.button===1 || (e.button===0 && e.altKey)) {
    panning=true; px0=e.clientX; py0=e.clientY;
    ppX=S.panX; ppY=S.panY; e.preventDefault();
  }
});
document.addEventListener('mousemove', e => {
  if (panning) {
    S.panX = ppX + (e.clientX - px0);
    S.panY = ppY + (e.clientY - py0);
    applyTransform();
  }
});
document.addEventListener('mouseup', () => { panning=false; });

// ── Toolbar wiring ────────────────────────────────────────
document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    S.tool = btn.dataset.tool;
    document.querySelectorAll('.tool-btn[data-tool]')
      .forEach(b => b.classList.toggle('active', b.dataset.tool === S.tool));
  });
});

function pickTool(t) {
  S.tool = t;
  document.querySelectorAll('.tool-btn[data-tool]')
    .forEach(b => b.classList.toggle('active', b.dataset.tool === t));
}

// Color
const colorInp = document.getElementById('color-inp');
const colorRing = document.getElementById('color-ring');
colorInp.addEventListener('input', e => {
  S.color = e.target.value;
  colorRing.style.backgroundColor = S.color;
});
colorRing.style.backgroundColor = S.color;

// Size
const sizeSlider = document.getElementById('size-slider');
sizeSlider.addEventListener('input', e => {
  S.size = +e.target.value;
  document.getElementById('size-num').textContent = S.size;
});

// Playback
document.getElementById('play-btn').addEventListener('click', play);
document.getElementById('stop-btn').addEventListener('click', stopAnim);

// FPS
document.getElementById('fps-inp').addEventListener('change', e => {
  S.fps = Math.max(1, Math.min(60, +e.target.value || 12));
  S.frames.forEach(f => { f.duration = Math.round(1000 / S.fps); });
});

// Onion
document.getElementById('onion-btn').addEventListener('click', () => {
  S.onion = !S.onion;
  document.getElementById('onion-btn').classList.toggle('active', S.onion);
  renderOnion();
});

// Undo / Redo
document.getElementById('undo-btn').addEventListener('click', undo);
document.getElementById('redo-btn').addEventListener('click', redo);

// Frame controls
document.getElementById('add-frame-btn').addEventListener('click', addFrame);
document.getElementById('add-frame-cell').addEventListener('click', addFrame);
document.getElementById('dup-frame-btn').addEventListener('click', dupFrame);
document.getElementById('del-frame-btn').addEventListener('click', () => delFrame());

// Zoom buttons
document.getElementById('zoom-in-btn').addEventListener('click', () =>
  zoomAt(1.25, wrapper.clientWidth/2, wrapper.clientHeight/2));
document.getElementById('zoom-out-btn').addEventListener('click', () =>
  zoomAt(0.8, wrapper.clientWidth/2, wrapper.clientHeight/2));
document.getElementById('zoom-fit-btn').addEventListener('click', fitScreen);

// Layers
document.getElementById('toggle-layers-btn').addEventListener('click', () =>
  document.getElementById('layers-panel').classList.toggle('closed'));
document.getElementById('close-layers-btn').addEventListener('click', () =>
  document.getElementById('layers-panel').classList.add('closed'));
document.getElementById('add-layer-btn').addEventListener('click', addLayer);
document.getElementById('del-layer-btn').addEventListener('click', delLayer);

// Opacity
document.getElementById('opacity-slider').addEventListener('input', e => {
  const pct = +e.target.value;
  document.getElementById('opacity-val').textContent = pct + '%';
  const fr = S.frames[S.frame];
  if (fr.layers[S.layer]) {
    fr.layers[S.layer].opacity = pct / 100;
    renderComp();
    refreshLayersPanel();
  }
});

// ── Keyboard shortcuts ────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();

  if (e.ctrlKey || e.metaKey) {
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if (k === 'z' &&  e.shiftKey) { e.preventDefault(); redo(); return; }
    if (k === 'y')                 { e.preventDefault(); redo(); return; }
    return;
  }

  switch (k) {
    case 'p': pickTool('pen');    break;
    case 'b': pickTool('brush');  break;
    case 'e': pickTool('eraser'); break;
    case 'f': pickTool('fill');   break;
    case ' ': e.preventDefault(); play(); break;
    case '+': case '=': zoomAt(1.25, wrapper.clientWidth/2, wrapper.clientHeight/2); break;
    case '-':            zoomAt(0.8,  wrapper.clientWidth/2, wrapper.clientHeight/2); break;
    case '0':            fitScreen(); break;
    case 'arrowleft':  if (S.frame > 0) gotoFrame(S.frame-1); break;
    case 'arrowright': if (S.frame < S.frames.length-1) gotoFrame(S.frame+1); break;
  }
});

// ── Init ──────────────────────────────────────────────────
saveHist();
syncUndoRedo();
syncOpacitySlider();

// Close layers panel on narrow screens by default
if (window.innerWidth < 600) {
  document.getElementById('layers-panel').classList.add('closed');
}

// Wait until the wrapper has real dimensions before fitting
// (rAF alone fires too early on mobile before layout settles)
function initFit() {
  if (wrapper.clientWidth > 10 && wrapper.clientHeight > 10) {
    fitScreen();
    render();
    refreshTimeline();
  } else {
    setTimeout(initFit, 30);
  }
}
initFit();

// Refit whenever the window resizes (orientation change, browser chrome)
const ro = new ResizeObserver(() => { if (!S.playing) fitScreen(); });
ro.observe(wrapper);
</script>
</body>
</html>
